[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hemtscout"
version = "0.1.0"
description = "Local HEMT paper library, retrieval, and evaluation tools for Hermes Agent"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "PyMuPDF>=1.24"]

[project.scripts]
hemtscout = "hemtscout.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
